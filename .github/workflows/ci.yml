name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TC#34: 비공개 설정 파일이 저장소에 추적되면 실패시킨다 (spec NFR#5).
      - name: Guard secrets
        run: |
          leaked=$(git ls-files | grep -E '(^|/)(local\.properties|\.firebaserc|google-services\.json)$|\.(jks|keystore)$' || true)
          if [ -n "$leaked" ]; then echo "::error::committed secret files: $leaked"; exit 1; fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Firebase 값 없이 빌드한다 → fork PR 에서도 동일하게 통과해야 한다.
      - run: ./gradlew check assembleDebug --console=plain
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: argos-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm --prefix firebase ci
      - run: npm --prefix firebase test
