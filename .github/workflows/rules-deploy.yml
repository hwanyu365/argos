name: Deploy database rules

on:
  push:
    branches: [main]
    paths: [database.rules.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm --prefix firebase ci
      # 규칙이 보안의 전부이므로 테스트를 통과한 경우에만 배포한다.
      - run: npm --prefix firebase test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx --prefix firebase firebase deploy --only database --project "$PROJECT_ID" --non-interactive
        env:
          PROJECT_ID: ${{ secrets.ARGOS_FIREBASE_PROJECT_ID }}
