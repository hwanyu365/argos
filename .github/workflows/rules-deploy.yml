name: Deploy database rules

on:
  push:
    branches: [main]
    paths: [database.rules.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm --prefix firebase ci
      # 규칙이 보안의 전부이므로 테스트를 통과한 경우에만 배포한다.
      - run: npm --prefix firebase test
      # secret 이 없으면(미등록, dependabot·fork 트리거) 실패 대신 건너뛴다.
      - id: secret
        env:
          TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::FIREBASE_SERVICE_ACCOUNT 미등록 → 건너뜀"; fi
      - if: steps.secret.outputs.ok == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - if: steps.secret.outputs.ok == 'true'
        run: npm --prefix firebase exec -- firebase deploy --only database --project "$PROJECT_ID" --non-interactive
        env:
          PROJECT_ID: ${{ secrets.ARGOS_FIREBASE_PROJECT_ID }}
