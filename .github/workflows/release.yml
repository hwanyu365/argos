name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ARGOS_VERSION_NAME: ${{ github.ref_name }}
          ARGOS_VERSION_CODE: ${{ github.run_number }}
          ARGOS_FIREBASE_API_KEY: ${{ secrets.ARGOS_FIREBASE_API_KEY }}
          ARGOS_FIREBASE_APP_ID: ${{ secrets.ARGOS_FIREBASE_APP_ID }}
          ARGOS_FIREBASE_PROJECT_ID: ${{ secrets.ARGOS_FIREBASE_PROJECT_ID }}
          ARGOS_FIREBASE_DATABASE_URL: ${{ secrets.ARGOS_FIREBASE_DATABASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew check assembleRelease --console=plain
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "argos-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "argos-${GITHUB_REF_NAME}.apk" --generate-notes
