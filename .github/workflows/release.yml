name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 쓰기 토큰이 git 설정에 남으면 빌드 스크립트가 읽을 수 있다. gh 는 GH_TOKEN 으로 동작한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm --prefix firebase ci
      - run: |
          ./gradlew check --console=plain
          npm --prefix firebase test
      # 산출물 빌드·서명·배포는 스택마다 다르다. 비밀값은 Secrets 로만 넣고, 로그에 값이나 다운로드 URL 이 찍히지 않게 한다.
      # public 저장소의 Release 첨부물은 누구나 받을 수 있다 → APK 는 Release 에 첨부하지 않고 Firebase App Distribution 테스터에게만 배포한다.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ARGOS_VERSION_NAME: ${{ github.ref_name }}
          ARGOS_VERSION_CODE: ${{ github.run_number }}
          ARGOS_FIREBASE_API_KEY: ${{ secrets.ARGOS_FIREBASE_API_KEY }}
          ARGOS_FIREBASE_APP_ID: ${{ secrets.ARGOS_FIREBASE_APP_ID }}
          ARGOS_FIREBASE_PROJECT_ID: ${{ secrets.ARGOS_FIREBASE_PROJECT_ID }}
          ARGOS_FIREBASE_DATABASE_URL: ${{ secrets.ARGOS_FIREBASE_DATABASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Distribute to testers
        env:
          APP_ID: ${{ secrets.ARGOS_FIREBASE_APP_ID }}
          # 테스터 그룹 alias 는 저장소 변수로 둔다. 이메일은 Firebase 콘솔에만 있다. GROUPS 는 bash 예약 변수라 쓰지 않는다.
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'family' }}
        # CLI 가 토큰이 든 APK 다운로드 링크를 출력하는데 public 저장소 로그는 누구나 본다 → URL 이 있는 줄은 버린다.
        # shell: bash 는 pipefail 을 켜서 grep 뒤에서도 CLI 실패가 job 실패로 남게 한다. 출력이 전부 걸러질 때 grep 의 종료 코드 1 은 무시한다.
        shell: bash
        run: |
          git log -1 --format='%s' > notes.txt
          npm --prefix firebase exec -- firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk --app "$APP_ID" --groups "$TESTER_GROUPS" --release-notes-file notes.txt 2>&1 | { grep -v 'https\?://' || true; }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
