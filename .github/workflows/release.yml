name: Release

on:
  push:
    tags: ["v*"]

# public 저장소의 Release·artifact 는 누구나 받을 수 있어, APK 는 Firebase App Distribution 테스터에게만 배포한다 (GH-11).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ARGOS_VERSION_NAME: ${{ github.ref_name }}
          ARGOS_VERSION_CODE: ${{ github.run_number }}
          ARGOS_FIREBASE_API_KEY: ${{ secrets.ARGOS_FIREBASE_API_KEY }}
          ARGOS_FIREBASE_APP_ID: ${{ secrets.ARGOS_FIREBASE_APP_ID }}
          ARGOS_FIREBASE_PROJECT_ID: ${{ secrets.ARGOS_FIREBASE_PROJECT_ID }}
          ARGOS_FIREBASE_DATABASE_URL: ${{ secrets.ARGOS_FIREBASE_DATABASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew check assembleRelease --console=plain
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm --prefix firebase ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Distribute to testers
        env:
          APP_ID: ${{ secrets.ARGOS_FIREBASE_APP_ID }}
          # 테스터 그룹 alias 는 저장소 변수로 둔다. 이메일은 Firebase 콘솔에만 있다. GROUPS 는 bash 예약 변수라 쓰지 않는다.
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'family' }}
        run: |
          git log -1 --format='%s' > notes.txt
          npm --prefix firebase exec -- firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk --app "$APP_ID" --groups "$TESTER_GROUPS" --release-notes-file notes.txt
