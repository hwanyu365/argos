name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # fork PR 은 secret 이 없고 외부 입력이므로 같은 저장소 브랜치만 리뷰한다. dependabot PR 에도 secret 이 전달되지 않는다.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # secret 이 없으면(미등록, dependabot·fork 트리거) 실패 대신 건너뛴다.
      - id: secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::CLAUDE_CODE_OAUTH_TOKEN 미등록 → 건너뜀"; fi
      - if: steps.secret.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - if: steps.secret.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR 을 리뷰한다. 한국어로 쓰고, 지적은 해당 줄에 inline comment 로 남긴다.
            - CLAUDE.md 의 규칙(설정값 비공개, TC 번호, 테스트 위치, 커밋 형식)을 지켰는지 확인한다.
            - 동작이 바뀌었는데 docs/specification.md 가 갱신되지 않았거나, 새 요구사항에 대응 TC 가 없으면 지적한다.
            - database.rules.json 이 바뀌었으면 firebase/rules.test.js 에 대응 테스트가 있는지 확인한다.
            - 버그와 보안 문제를 우선하고, 취향 문제는 남기지 않는다.
            inline comment 로 남기지 않은 요약은 `gh pr comment` 로 한 번만 남긴다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
